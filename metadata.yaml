desc: 一款为 AstrBot 设计的、功能丰富的放置类修仙游戏插件。让你在聊天群中体验从凡人到大能的修行之路，工作摸鱼、畅聊吹水的同时亦可得道飞升！🆕 v3.9.2 死亡系统简化：死亡立即扣5%修为，到时间自动复活（无需手动命令）；战力影响死亡率：装备+丹药buff可降低最多30%死亡率，同境界神装比裸奔安全30%。🛡️ v3.9.1 死亡机制修复：世界事件死亡率随境界衰减（高出推荐上限 6 级后完全免死）、回生丹可抵消世界事件阵亡、修复宗门/师父救援复活后修为只剩 50% 的 BUG。🎉 v3.9.0 系统优化与扩展：灵田新增高级灵草种植（3-5星材料，还魂丹可自给）、宗门/师徒救援复活（社交互助复活路线）。🌍 v3.7.0 世界事件系统替代历练，多人协作副本自动生成与结算。💊 v3.6.0 委托炼丹与炼丹师职业。

desc: 一款为 AstrBot 设计的、功能丰富的放置类修仙游戏插件。让你在聊天群中体验从凡人到大能的修行之路，工作摸鱼、畅聊吹水的同时亦可得道飞升！🆕 v3.7.0 世界事件系统：移除历练玩法，改为群内多人协作的随机事件（低阶/中阶/高阶/史诗四档，自动生成并广播）；报名截止自动开战、结束自动结算，幸存者全额奖励、阵亡者保留20%奖励（阵亡触发死亡机制：低阶劫后重生、金丹以上元神状态）；掉落九转仙草等稀有炼丹材料与专属装备，可掉落还魂丹/悟道丹丹方。

desc: 一款为 AstrBot 设计的、功能丰富的放置类修仙游戏插件。让你在聊天群中体验从凡人到大能的修行之路，工作摸鱼、畅聊吹水的同时亦可得道飞升！⚔️ v3.10.0 世界事件「可见战斗过程」：开战后按 3-5 个回合逐段推进并实时播报战况，新增「世界事件战报」逐回合回放个人视角；整场死亡率与旧版完全一致。💀 死亡率模型重做为「基准 × 境界优势 × 战力优势」：每领先门槛 1 个小境界 ×0.72，战力 2 倍减半 / 4 倍降到 1/4（上限由 30% 提到 90%），风险低于 1.5% 视同免死；低风险却阵亡会判为「异变」并给出离谱死因。🐛 修复战力减免两个面板开关失效、帮助总览版本号漂移。🎁 v3.9.4 新增「我的世界事件奖励」查询个人掉落明细。
version: v3.10.0

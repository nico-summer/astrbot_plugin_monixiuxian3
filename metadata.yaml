desc: 一款为 AstrBot 设计的、功能丰富的放置类修仙游戏插件。让你在聊天群中体验从凡人到大能的修行之路，工作摸鱼、畅聊吹水的同时亦可得道飞升！🆕 v3.9.0 系统优化与扩展：灵田新增高级灵草种植（3-5星材料，还魂丹可自给）、宗门/师徒救援复活（社交互助复活路线）；v3.8.1 死亡惩罚/世界事件/AI 参数可在 AstrBot 配置面板直接调整。🌍 v3.7.0 世界事件系统替代历练，多人协作副本自动生成与结算，稀有材料产出。💊 v3.6.0 委托炼丹与炼丹师职业。⚰️ v3.5.8 死亡机制重构（劫后重生/元神状态）。

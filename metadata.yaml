name: astrbot_plugin_monixiuxian2_niko # 插件唯一标识
display_name: 模拟修仙v2 # 插件展示名
desc: 一款为 AstrBot 设计的、功能丰富的放置类修仙游戏插件。让你在聊天群中体验从凡人到大能的修行之路，工作摸鱼、畅聊吹水的同时亦可得道飞升！🌍 v3.11.0 世界事件奖励重构（回应「顶着死亡风险只掉俩魔核」）：修为/灵石改为按境界成长（以模板 reward_ref_level 为基准，每高出 1 个小境界 ×1.15~1.60，各档收益对齐并高于同境界秘境的 1.0~2.3 倍，面板新增「生还收益 / 折算风险后期望」预览）；材料每场至少保底 1 件、稀有材料支持 ×2~5 多件掉落，还魂丹材料成型速度约提升 2 倍；阵亡奖励保留比例 20% → 50%，且事件阵亡只承担常规一半的修为损失（death_exp_loss_scale）；世界事件材料（魔核 / 魔晶 / 妖兽内丹 / 九转仙草等 14 种）纳入炼化，不再是压箱底废料。🎁 v3.10.0 世界事件可见战斗过程：3-5 回合逐段播报 + 「世界事件战报」个人视角回放。
version: v3.11.0

desc: 一款为 AstrBot 设计的、功能丰富的放置类修仙游戏插件。让你在聊天群中体验从凡人到大能的修行之路，工作摸鱼、畅聊吹水的同时亦可得道飞升！🆕 v3.5.9 炼丹系统升级：丹药分1-5星，商店只售1-2星，3星以上需自行炼制；新增还魂丹（5星，元神状态完美复活、修为无损）、悟道丹、护道丹，狂暴丹/金刚丹改造为3星炼丹专属；成功率受境界（金丹+10%/化神+20%/合体+30%）与炼丹师称号（+15%）影响，失败返还50%材料并小概率产出废丹；新增「配方详情」「使用还魂丹」指令。

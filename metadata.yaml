desc: 一款为 AstrBot 设计的、功能丰富的放置类修仙游戏插件。让你在聊天群中体验从凡人到大能的修行之路，工作摸鱼、畅聊吹水的同时亦可得道飞升！💎 v3.9.3 饰品装备系统上线：新增饰品装备栏，属性计入战力；修复5个武器属性缺失问题。🆕 v3.9.2 死亡系统简化：死亡立即扣5%修为，到时间自动复活（无需手动命令）；战力影响死亡率：装备+丹药buff可降低最多30%死亡率，同境界神装比裸奔安全30%。🛡️ v3.9.1 死亡机制修复：世界事件死亡率随境界衰减（高出推荐上限 6 级后完全免死）、回生丹可抵消世界事件阵亡、修复宗门/师父救援复活后修为只剩 50% 的 BUG。

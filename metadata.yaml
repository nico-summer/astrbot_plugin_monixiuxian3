desc: 一款为 AstrBot 设计的、功能丰富的放置类修仙游戏插件。让你在聊天群中体验从凡人到大能的修行之路，工作摸鱼、畅聊吹水的同时亦可得道飞升！🆕 v3.8.0 管理员功能与AI集成：管理员可私聊bot手动创建世界事件（指定难度/群号/奖励倍率），查看所有活动事件并强制结束；支持OpenAI格式通用API生成事件文案（兼容DeepSeek、硅基流动、OpenRouter等），AI调用失败自动降级为固定模板。🌍 v3.7.0 世界事件系统替代历练，多人协作副本自动生成与结算，稀有材料产出。💊 v3.6.0 委托炼丹与炼丹师职业。⚰️ v3.5.8 死亡机制重构（劫后重生/元神状态）。

name: astrbot_plugin_monixiuxian2_niko # 插件唯一标识
display_name: 模拟修仙v2 # 插件展示名
desc: 一款为 AstrBot 设计的、功能丰富的放置类修仙游戏插件。让你在聊天群中体验从凡人到大能的修行之路，工作摸鱼、畅聊吹水的同时亦可得道飞升！🔎 v3.11.4 查证「一键服用会不会误吞还魂丹」：全链路实测为不会（还魂丹声明 manual_only，一键服用直接跳过并提示「需手动使用」；复活只走「使用还魂丹 / 服用丹药 还魂丹」独立链路，非元神状态拒绝、失败自动退还）；顺带修复真实显示误报——get_consumption_limit() 未处理 manual_only，导致「我的信息」把还魂丹写成「可服用 N 个」，已改为「暂不可服用（需手动使用）」。🐛 v3.11.3 修复「一键炼化把还魂丹材料炼了」：v3.11.0 把 14 种世界事件材料补进炼化白名单时，混进了 6 种丹药配方原料（还魂丹的九转仙草/太古龙骨/灵髓精华/月华精粹、狂暴丹的嗜血草/妖兽内丹），而「一键炼化」是无差别全炼，玩家攒的还魂丹原料一条指令就成了灵石；现在保护名单改为从 config/alchemy_recipes.json 动态推导，一键炼化自动跳过配方原料并逐条提示，储物戒标签显示「配方材料🔒」，手动「炼化材料」仍可用但会警告。🐛 v3.11.2 修复「装备饰品 = 装备被吞」：`update_player()` 写库列漏了 `accessory`，装备饰品只写内存、落库即丢（物品还被「取出」动作从储物戒删了，装备栏又是空的），且 handler 里那份槽位映射漏了「饰品」，`卸下 饰品` 会静默销毁饰品；现已补齐写库字段（Player 51 字段 ⇄ SET 列缺失 1→0）、卸下改为「先存回储物戒再清空装备栏」、`卸下` 支持直接写装备名（卸下 戮仙剑阵），`我的装备`/`我的信息` 补饰品行，储物戒满时替换装备不再吞旧装备。🐛 v3.11.1 修复「看不到战斗过程」：元神白名单漏登记 v3.10.0 新增的「世界事件战报 / 我的世界事件奖励」，导致「阵亡变元神 → 想回看自己怎么死的 → 被拦下」；补上这 2 条并核对全部 151 条指令（只读指令缺失 4→0）；同时修复战报误报「该场事件未启用可见战斗过程」（原来只取最近一场，现向前扫描 20 场优先回放真有逐回合记录的一场）。🌍 v3.11.0 世界事件奖励重构（回应「顶着死亡风险只掉俩魔核」）：修为/灵石改为按境界成长（以模板 reward_ref_level 为基准，每高出 1 个小境界 ×1.15~1.60，各档收益对齐并高于同境界秘境的 1.0~2.3 倍，面板新增「生还收益 / 折算风险后期望」预览）；材料每场至少保底 1 件、稀有材料支持 ×2~5 多件掉落，还魂丹材料成型速度约提升 2 倍；阵亡奖励保留比例 20% → 50%，且事件阵亡只承担常规一半的修为损失（death_exp_loss_scale）；世界事件材料（魔核 / 魔晶 / 妖兽内丹 / 九转仙草等 14 种）纳入炼化，不再是压箱底废料。🎁 v3.10.0 世界事件可见战斗过程：3-5 回合逐段播报 + 「世界事件战报」个人视角回放。
